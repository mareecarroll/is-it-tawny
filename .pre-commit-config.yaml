-   repo: https://github.com/cpplint/cpplint
    rev: 1.6.1
    hooks:
      - id: cpplint
        files: "\\.(c|cc|cpp|cxx|h|hpp)$"

-   repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: cppcheck
        args:
          - "--enable=all"
          - "--inconclusive"
          - "--std=c++20"
        files: "\\.(c|cc|cpp|cxx|h|hpp)$"
